name: Finish Lotus POS D1 migration 0005

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotus-pos-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply D1 migrations to pos_unified
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "8973c5ef559d1c731b6c1a7b4586ca23"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Check out the selected repository branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check that the Cloudflare token is configured
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Verify the existing four migrations and import 0005 safely
        run: node scripts/finish-d1-0005.mjs
      - name: Confirm there are no unapplied migrations
        run: npx wrangler d1 migrations list pos_unified --remote
      - name: Print migration history
        run: npx wrangler d1 execute pos_unified --remote --command "SELECT name FROM d1_migrations ORDER BY id;"
