name: Upgrade Lotus POS D1 0014 and 0015 QR Tables

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotus-pos-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: "8973c5ef559d1c731b6c1a7b4586ca23"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require D1 token
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Check live D1 history and partial schema
        id: inspect
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync,appendFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          const id=config.d1_databases.find(x=>x.binding==='DB'&&x.database_name==='pos_unified')?.database_id;
          if(!id)throw Error('Missing D1 binding');
          const query=async sql=>{
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${id}/query`,{
              method:'POST',headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({sql})});
            const body=await response.json();
            if(!response.ok||!body.success||!body.result?.[0]?.success)throw Error(`Could not inspect live D1: ${sql}`);
            return body.result[0].results||[];
          };
          const expected=readdirSync('migrations').filter(x=>/^\d{4}_.+\.sql$/.test(x)).sort();
          const history=(await query('SELECT name FROM d1_migrations ORDER BY id')).map(x=>x.name);
          if(expected.length!==15||history.length<13||history.length>15||history.some((name,i)=>name!==expected[i]))throw Error(`Unexpected D1 history: ${history.join(', ')}`);
          const columns=await query("SELECT name FROM pragma_table_info('members') WHERE name IN ('email','birthday','note','tier_override','version')");
          const marker=await query("SELECT name FROM sqlite_schema WHERE name='pos_auto_print_config'");
          const visits=await query("SELECT name FROM sqlite_schema WHERE name='qr_table_visits'");
          if(history.length===13&&(columns.length||marker.length))throw Error('Partial 0014 schema found; inspect D1 before retrying');
          if(history.length>=14&&(columns.length!==5||marker.length!==1))throw Error('0014 history exists but schema is incomplete');
          if(history.length<15&&visits.length)throw Error('Partial 0015 schema found; inspect D1 before retrying');
          if(history.length===15&&visits.length!==1)throw Error('0015 history exists but QR table is missing');
          appendFileSync(process.env.GITHUB_OUTPUT,`apply14=${history.length===13}\napply15=${history.length<15}\n`);
          NODE
      - name: Apply 0014 and stamp the same D1 import
        if: steps.inspect.outputs.apply14 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          staged="$(mktemp --suffix=.sql)"
          cat migrations/0014_customers.sql > "$staged"
          printf "\nINSERT INTO d1_migrations(name) VALUES ('0014_customers.sql');\n" >> "$staged"
          npx wrangler d1 execute DB --remote --file="$staged" --yes
          rm -f "$staged"
      - name: Apply 0015 QR visits and stamp the same D1 import
        if: steps.inspect.outputs.apply15 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          staged="$(mktemp --suffix=.sql)"
          cat migrations/0015_qr_table_visits.sql > "$staged"
          printf "\nINSERT INTO d1_migrations(name) VALUES ('0015_qr_table_visits.sql');\n" >> "$staged"
          npx wrangler d1 execute DB --remote --file="$staged" --yes
          rm -f "$staged"
      - name: Verify all 15 migrations and Echo menu
        run: npm run check:d1
