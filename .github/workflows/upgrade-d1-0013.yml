name: Upgrade Lotus POS D1 0010 through 0013

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotus-pos-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "8973c5ef559d1c731b6c1a7b4586ca23"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require configured D1 token
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Confirm special 0009 upgrade was completed first
        run: node scripts/check-d1-ready.mjs --through-0009
      - name: Apply remaining migrations in order
        run: npm run db:remote
      - name: Verify all 13 migrations and Echo menu
        run: npm run check:d1
