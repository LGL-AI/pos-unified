name: Upgrade Lotus POS D1 0009 - Sales independent from inventory

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotus-pos-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: "8973c5ef559d1c731b6c1a7b4586ca23"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require configured D1 token
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install isolated inventory estimate migration
        run: node scripts/upgrade-d1-0009.mjs
